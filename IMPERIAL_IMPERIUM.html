<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IMPERIUM PRO</title>
    <style>
        /* BASE Y SCROLL */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; margin: 0; padding: 0; background-color: #000; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        .pantalla { display: none; height: 100vh; width: 100%; flex-direction: column; padding: 20px; position: absolute; top: 0; left: 0; }
        .activa { display: flex !important; z-index: 10; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* CONTENEDOR CON SCROLL */
        .contenido-scroll { flex: 1; overflow-y: auto; padding-right: 5px; margin-bottom: 10px; }

        /* LOGO */
        .logo-container { text-align: center; margin-bottom: 30px; margin-top: 20px; }
        .logo-img { max-width: 280px; width: 100%; border-radius: 15px; box-shadow: 0 0 20px rgba(255, 0, 0, 0.4); margin-bottom: 15px; }
        .titulo-oro { color: #ffd700; font-size: 2.2rem; font-weight: 900; letter-spacing: 3px; text-shadow: 0 0 15px rgba(255,215,0,0.5); margin: 0; }

        /* BOTONES GLOBALES */
        .btn-grande { background: linear-gradient(180deg, #ffcc00 0%, #b8860b 100%); color: #000; border: none; padding: 20px; border-radius: 12px; font-size: 1.2rem; font-weight: bold; width: 100%; cursor: pointer; box-shadow: 0 4px 15px rgba(255,215,0,0.3); margin-top: auto; }
        .btn-volver { background: #222; color: #aaa; border: 1px solid #444; padding: 10px 20px; border-radius: 8px; font-size: 0.9rem; align-self: flex-start; margin-bottom: 15px; cursor: pointer; font-weight: bold; }

        /* SETUP FILAS */
        .fila-setup { background: #111; margin-bottom: 10px; padding: 15px; border-radius: 12px; display: flex; align-items: center; gap: 10px; border-left: 8px solid; }
        .fila-setup input[type="text"] { flex: 1; background: #222; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 6px; font-size: 1rem; }
        .fila-setup input[type="number"] { width: 60px; padding: 10px; border-radius: 6px; border: none; font-weight: bold; text-align: center; font-size: 1.1rem; }

        /* TABLERO JUEGO */
        .grid-guerra { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card-army { background: #151515; padding: 20px 10px; border-radius: 15px; border-top: 6px solid; text-align: center; position: relative; cursor: pointer; transition: opacity 0.3s; }
        .card-army.seleccionado { outline: 4px solid #ffd700; background: #252525; transform: scale(0.98); }
        .pts-grande { font-size: 2.5rem; font-weight: bold; display: block; margin-top: 5px; }
        .derrotado-texto { font-size: 1.2rem; font-weight: bold; color: #ff3333; display: block; margin-top: 15px; letter-spacing: 1px; }

        /* MODAL DE ACCIÓN */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; }
        .modal-cuerpo { background: #111; padding: 25px; border-radius: 20px; border: 1px solid #ffd700; width: 90%; display: flex; gap: 15px; }
        
        /* CRONÓMETROS NUEVOS */
        .btn-abrir-relojes { background: #111; color: #ffd700; border: 2px solid #ffd700; padding: 15px; border-radius: 12px; font-weight: bold; font-size: 1.1rem; width: 100%; margin-top: 15px; cursor: pointer; }
        .reloj-card { background: #111; border: 1px solid #444; margin-bottom: 15px; padding: 20px; border-radius: 20px; text-align: center; }
        .hora { font-size: 3.5rem; color: #ffd700; font-family: monospace; display: block; margin-bottom: 10px; }
        .btn-play { width: 100%; padding: 15px; background: #060; color: #fff; border: none; border-radius: 10px; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
        .btn-reset-relojes { background: #500; color: #fff; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; margin-top: auto; margin-bottom: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="P1" class="pantalla activa">
        <div class="logo-container">
            <img src="1000168152.jpg" alt="Logo Imperium" class="logo-img" onerror="this.style.display='none'">
            <h1 class="titulo-oro">IMPERIUM</h1>
            <p style="color:#888; letter-spacing: 3px; font-size: 0.9rem;">MASTER TRACKER</p>
        </div>
        <button class="btn-grande" onclick="ir('P2')">NUEVA PARTIDA</button>
    </div>

    <div id="P2" class="pantalla">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <button class="btn-volver" onclick="ir('P1')">← Atrás</button>
            <h2 style="color:#ffd700; margin: 0 0 15px 0;">EJÉRCITOS</h2>
        </div>
        
        <div class="contenido-scroll" id="lista-setup"></div>
        <button class="btn-grande" onclick="empezarJuego()">EMPEZAR GUERRA</button>
    </div>

    <div id="P3" class="pantalla">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <button class="btn-volver" onclick="ir('P2')" style="margin:0;">← Menú</button>
            <span id="mensaje" style="color:#ffd700; font-weight:bold; font-size:1.1rem; text-transform: uppercase;">Toca Atacante</span>
        </div>

        <div class="contenido-scroll">
            <div id="tablero" class="grid-guerra"></div>
        </div>

        <button class="btn-abrir-relojes" onclick="ir('P4')">⏱️ ABRIR CRONÓMETROS</button>
    </div>

    <div id="P4" class="pantalla">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <button class="btn-volver" onclick="ir('P3')">← Volver al Tablero</button>
        </div>

        <div class="contenido-scroll">
            <div class="reloj-card">
                <small style="color:#aaa;">🛡️ REFUERZO (5 MIN)</small>
                <span id="txt-t1" class="hora">05:00</span>
                <button id="btn-t1" onclick="timer(1, 300)" class="btn-play">INICIAR</button>
            </div>

            <div class="reloj-card">
                <small style="color:#aaa;">⚔️ ATAQUE (2 MIN)</small>
                <span id="txt-t2" class="hora">02:00</span>
                <button id="btn-t2" onclick="timer(2, 120)" class="btn-play">INICIAR</button>
            </div>

            <div class="reloj-card">
                <small style="color:#aaa;">📦 REORGANIZACIÓN (1 MIN)</small>
                <span id="txt-t3" class="hora">01:00</span>
                <button id="btn-t3" onclick="timer(3, 60)" class="btn-play">INICIAR</button>
            </div>
        </div>
        
        <button class="btn-reset-relojes" onclick="resetAllTimers()">🔄 REINICIAR TIEMPOS</button>
    </div>

    <div id="modal-accion" class="modal">
        <div class="modal-cuerpo">
            <button onclick="definirAccion('W')" style="background:#2e7d32; color:white; border:none; padding:25px; border-radius:12px; flex:1; font-weight:bold; font-size: 1.2rem; cursor: pointer;">GANÓ</button>
            <button onclick="definirAccion('L')" style="background:#c62828; color:white; border:none; padding:25px; border-radius:12px; flex:1; font-weight:bold; font-size: 1.2rem; cursor: pointer;">PERDIÓ</button>
        </div>
    </div>

    <script>
        const colores = [
            {n:'Rojo', c:'#ff3333'}, {n:'Azul', c:'#3385ff'}, 
            {n:'Verde', c:'#33ff70'}, {n:'Amarillo', c:'#f0ff33'},
            {n:'Naranja', c:'#ff9933'}, {n:'Blanco', c:'#ffffff'}
        ];
        
        let app = { 
            atacante: null, modo: null, 
            t: {
                1: {s: 300, max: 300, i: null, on: false}, 
                2: {s: 120, max: 120, i: null, on: false}, 
                3: {s: 60, max: 60, i: null, on: false}
            } 
        };

        const listaS = document.getElementById('lista-setup');
        colores.forEach((col, i) => {
            listaS.innerHTML += `
                <div class="fila-setup" style="border-color:${col.c}">
                    <input type="checkbox" id="chk${i}" checked style="width:25px;height:25px;">
                    <input type="text" id="nom${i}" placeholder="${col.n}">
                    <input type="number" id="val${i}" value="30">
                </div>`;
        });

        function ir(id) {
            document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
            document.getElementById(id).classList.add('activa');
            if(id === 'P2') resetTurno();
        }

        function empezarJuego() {
            const tablero = document.getElementById('tablero');
            tablero.innerHTML = '';
            let activos = 0;
            colores.forEach((col, i) => {
                if(document.getElementById('chk'+i).checked) {
                    let nombre = document.getElementById('nom'+i).value || col.n;
                    let inicial = document.getElementById('val'+i).value;
                    tablero.innerHTML += `
                        <div id="army${i}" class="card-army" style="border-color:${col.c}" onclick="tocarEjercito(${i})">
                            <small style="text-transform:uppercase; color:#aaa; font-size: 0.8rem;">${nombre}</small>
                            <span id="pts${i}" class="pts-grande">${inicial}</span>
                        </div>`;
                    activos++;
                }
            });
            if(activos > 1) { ir('P3'); document.getElementById('mensaje').innerText = "TOCA ATACANTE"; } 
            else alert("Selecciona al menos 2 ejércitos para jugar.");
        }

        function tocarEjercito(id) {
            let el = document.getElementById('pts'+id);
            if(el.innerText === "DERROTADO") {
                alert("Este ejército ha sido derrotado y ya no puede participar.");
                resetTurno();
                return;
            }

            if(app.atacante === null) {
                app.atacante = id;
                document.getElementById('army'+id).classList.add('seleccionado');
                document.getElementById('modal-accion').style.display = 'flex';
                document.getElementById('mensaje').innerText = "RESULTADO DEL COMBATE:";
            } else if(app.modo !== null) {
                if(id === app.atacante) return;
                
                let a = document.getElementById('pts'+app.atacante);
                let d = el;
                
                let vA = parseInt(a.innerText);
                let vD = parseInt(d.innerText);

                if(app.modo === 'W' && vD > 0) { vA++; vD--; }
                if(app.modo === 'L' && vA > 0) { vA--; vD++; }
                
                // SISTEMA DERROTADO
                if (vA <= 0) { 
                    a.innerHTML = "DERROTADO"; a.className = "derrotado-texto"; 
                    document.getElementById('army'+app.atacante).style.opacity = "0.3"; 
                } else { a.innerText = vA; }

                if (vD <= 0) { 
                    d.innerHTML = "DERROTADO"; d.className = "derrotado-texto"; 
                    document.getElementById('army'+id).style.opacity = "0.3"; 
                } else { d.innerText = vD; }
                
                resetTurno();
            }
        }

        function definirAccion(m) {
            app.modo = m;
            document.getElementById('modal-accion').style.display = 'none';
            document.getElementById('mensaje').innerText = "¿CONTRA QUIÉN?";
        }

        function resetTurno() {
            app.atacante = null; app.modo = null;
            document.getElementById('mensaje').innerText = "TOCA ATACANTE";
            document.querySelectorAll('.card-army').forEach(e => e.classList.remove('seleccionado'));
            document.getElementById('modal-accion').style.display = 'none';
        }

        /* LÓGICA DE CRONÓMETROS (TU DISEÑO) */
        function timer(id, max) {
            var d = app.t[id];
            var btn = document.getElementById('btn-t' + id);
            if (d.on) {
                clearInterval(d.i); d.on = false;
                btn.innerHTML = "REANUDAR"; btn.style.background = "#d60";
            } else {
                d.on = true; btn.innerHTML = "PAUSAR"; btn.style.background = "#a00";
                d.i = setInterval(function() {
                    d.s--;
                    var m = Math.floor(d.s / 60);
                    var s = d.s % 60;
                    document.getElementById('txt-t' + id).innerHTML = (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
                    if (d.s <= 0) { clearInterval(d.i); d.on = false; btn.innerHTML = "INICIAR"; btn.style.background = "#060"; alert("¡TIEMPO AGOTADO!"); }
                }, 1000);
            }
        }

        function resetAllTimers() {
            if(!confirm("¿Seguro que quieres reiniciar los 3 relojes?")) return;
            for (var i = 1; i <= 3; i++) {
                var d = app.t[i];
                clearInterval(d.i); d.on = false; d.s = d.max;
                var m = Math.floor(d.s / 60); var s = d.s % 60;
                document.getElementById('txt-t' + i).innerHTML = (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
                document.getElementById('btn-t' + i).innerHTML = "INICIAR";
                document.getElementById('btn-t' + i).style.background = "#060";
            }
        }
    </script>
</body>
</html>
